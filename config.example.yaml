# Copy to config.yaml and adjust the paths for your machine.
# API keys: either export ALPACA_API_KEY / ALPACA_SECRET_KEY in your
# environment, or point env_file at a KEY=VALUE file containing them.
# The agent is paper-only: it refuses to start if ALPACA_LIVE_TRADE is set.

# The instrument folder, resolved relative to THIS file. Every *.yaml in
# it is one instrument that inherits the values below and overrides what it
# names. Set it to "_" for a single instrument built from this file alone.
config_path: configs

# Default instrument, used only when config_path is "_".
underlying: SPY

# Grid direction: true = put credit spreads (bullish), false = call credit
# spreads (bearish). One symbol may run both, as two separate configs.
start_long: true

# Grid parameters (carried over from the FX Kangaroo, tuning still open).
rebuy_1st_pct: 1.2      # % underlying drop before the 1st rebuy
rebuy_pct: 0.10         # % drop for every further rebuy
tp_pct: 0.10            # % of underlying price defining the take-profit cash
initial_qty: 1          # spreads of the first leg
max_invest_count: 20    # hard cap of legs per cluster
# Stop rebuying once the underlying ran this far (%) against the
# cluster's first leg. 0 = off. Positions are never closed by it.
max_adverse_pct: 5.0

# Spread selection: nearest expiration inside the DTE window, short strike
# nearest to spot, wing = first width candidate that exists as a strike.
dte_min: 4
dte_max: 10
spread_widths: [5, 6, 4, 7, 3, 8, 10]

# --- the AI risk gate -------------------------------------------------
#
# An LLM that is shown the WHOLE account and may only reduce the size of a
# rebuy the grid has already decided on - never enlarge one, never open
# one, never pick a strike. The clamp that guarantees that is in
# risk_gate.py, in code, not in the prompt.
#
# It is asked only about decisions that matter: a cluster at or past
# consult_from_leg legs, or an account whose options buying power has
# fallen below consult_below_headroom_pct of equity. Everything else
# passes through and costs nothing.
#
# On any failure - no key, timeout, refusal, unparseable answer - the grid
# proceeds with the quantity it asked for, loudly and counted. Failing the
# other way would turn a model outage into an untested strategy change
# while live positions are open.
risk_gate:
  enabled: false          # off until a key is installed; see key_env
  provider: anthropic     # anthropic | featherless
  model: claude-opus-5    # null = the provider default in risk_gate.py
  key_env: LLM_API_KEY    # environment variable holding the API key
  timeout_seconds: 20
  consult_from_leg: 4     # ask from this leg index onwards
  consult_below_headroom_pct: 40.0   # ...or below this much headroom
  max_reason_words: 20    # what is kept of the model stated reason

# Sampling rates in seconds (no timeouts anywhere - pure sampling).
poll_seconds: 5
poll_fill_seconds: 2
# Unfilled limit orders are canceled by ID after this many fill polls and
# re-quoted on the next loop.
fill_requote_samples: 30

# Paths.
cli_path: /path/to/alpaca        # official Alpaca CLI binary (github.com/alpacahq/cli)
env_file: null                   # optional KEY=VALUE file with the two API keys
# NOTE: no state_file when config_path names a folder - one file would be
# shared by every instrument. Each defaults to
# state/kangaroo_<symbol>_<side>.json.
