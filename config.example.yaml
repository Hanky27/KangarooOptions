# Copy to config.yaml and adjust the paths for your machine.
# API keys: either export ALPACA_API_KEY / ALPACA_SECRET_KEY in your
# environment, or point env_file at a KEY=VALUE file containing them.
# The agent is paper-only: it refuses to start if ALPACA_LIVE_TRADE is set.

underlying: SPY

# Grid parameters (carried over from the FX Kangaroo, tuning still open).
rebuy_1st_pct: 1.2      # % adverse underlying move before the 1st rebuy
rebuy_pct: 0.10         # % adverse move for every further rebuy
tp_pct: 0.10            # % of underlying price defining the take-profit cash
initial_qty: 1          # contracts of the first leg
max_invest_count: 20    # hard cap of legs per cluster
start_long: true        # first cluster is a CALL cluster; Mode1 toggles after

# Option contract selection: nearest expiration inside the DTE window,
# strike nearest to spot.
dte_min: 4
dte_max: 10

# Sampling rates in seconds (no timeouts anywhere - pure sampling).
poll_seconds: 5
poll_fill_seconds: 2

# Paths.
cli_path: /path/to/alpaca        # official Alpaca CLI binary (github.com/alpacahq/cli)
env_file: null                   # optional KEY=VALUE file with the two API keys
state_file: state/kangaroo_state.json
