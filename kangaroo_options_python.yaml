# Kangaroo Options - credit-spread grid (QuantroTrader GUI wiring).
# Entry point: run_engine.py -> backtest_options.run (the same simulator the
# research CLI uses).
#
# The bot trades N instruments, one per file in the folder named by the
# `config_path` parameter - the same loader shape the live agent uses, and
# resolved by the agent's own loader so a GUI run and the bot can never
# describe different sets. An instrument is a (symbol, direction) pair, so
# one symbol may carry both a put-spread and a call-spread grid.
bot: kangaroo_options

# --- Engine wiring (read by the QuantroTrader GUI toolbar) ---------------
engine: python
# Alpaca is a full BacktestingCache provider since 2026-08-28 (chart bars,
# date bounds via get_earliest_date --provider alpaca). The toolbar TF is
# the engine's RESOLUTION switch ([HOURLY 29.08.2026]): Day = EOD grid on
# the daily store (bars_file), Hour = hourly grid on Alpaca 1Hour bars
# (underlying store auto-fetched to data/<underlying>_1h.json, option marks
# from 1Hour option bars). Any other TF fails loud.
data_source: Alpaca/SPY/h1
broker: Alpaca
# The bot resolves its own universe from config_path, so there is no single
# instrument to name here. `portfolio: true` tells the GUI exactly that: it
# passes no --symbol, measures date coverage over the whole universe, and
# seeds its Symbol dropdown from the symbols a run actually traded. A
# concrete `symbol:` would pin the whole bot to ONE instrument
# (RobotPluginViewModel.IsSingleSymbolBot).
portfolio: true
symbol: _
timeframe: h1
starting_capital: 100000

parameters:

  rebuy_1st_pct:
    type: float
    default: 1.2
    range: [0.2, 3.0]
    step: 0.1
    description: "% underlying drop from the last leg's entry before the 1st rebuy (cluster has < 2 legs)."
    group: grid

  rebuy_pct:
    type: float
    default: 0.1
    range: [0.02, 1.0]
    step: 0.02
    description: "% underlying drop for every further rebuy."
    group: grid

  tp_pct:
    type: float
    default: 0.1
    range: [0.02, 1.0]
    step: 0.02
    description: "Take-profit threshold: cluster closes when its open P&L exceeds legs * initial_qty * 100 * (tp_pct% of the underlying close)."
    group: grid

  initial_qty:
    type: int
    default: 1
    range: [1, 10]
    step: 1
    description: "Spreads of the first leg; later legs grow by 1.1^n."
    group: grid

  max_invest_count:
    type: int
    default: 20
    range: [1, 30]
    step: 1
    description: "Hard cap of legs per cluster."
    group: grid

  max_adverse_pct:
    type: float
    default: 5.0
    range: [0.0, 20.0]
    step: 0.5
    description: "Stop REBUYING once the underlying has run this far (%) against the cluster's first leg. 0 disables it. Nothing is closed - the cluster keeps every position and its take-profit target; it only stops adding to a move that already went against it. Measured over SPY 1h 2025 AND 2026-01..08, both directions: 5 % lifts the four-cell net from +12,241 to +15,684 USD, cuts the worst drawdown from -10,952 to -7,429 and the long/short gap from 10,669 to 2,156; 4.5 % and 6 % are nearly as good, so the setting sits on a plateau rather than a spike."
    group: grid

  dte_min:
    type: int
    default: 4
    range: [1, 30]
    step: 1
    description: "Minimum days to expiration of a new leg's contracts."
    group: contracts

  dte_max:
    type: int
    default: 10
    range: [2, 45]
    step: 1
    description: "Maximum days to expiration of a new leg's contracts."
    group: contracts

  style:
    type: enum
    default: short_premium_spreads
    values: [short_premium_spreads, short_premium, long_options]
    description: "Execution style: short_premium_spreads (put/call credit spreads), short_premium (cash-secured puts), long_options (variant A, negative in every measured run)."
    group: strategy

  direction:
    type: enum
    default: long
    values: [long, short, mode1, sma200, sma200_flat]
    description: "Market side of the SINGLE-instrument fallback (config_path empty or _): long (put-spread grid), short (call-spread grid), mode1 (original toggle), sma200 (side from the 200-day SMA), sma200_flat (long above SMA, else flat). Ignored when config_path names a folder - each instrument config carries its own start_long. Measured SPY 02/2024-08/2026 (daily, after the 2026-08-29 wing-mark fix): long +2,688 / short -5,298 / mode1 +693 USD."
    group: strategy

  cost_usd:
    type: float
    default: 0.0
    range: [0.0, 5.0]
    step: 0.5
    description: "Execution cost in USD per spread per execution (entry and TP close; expiry costs nothing)."
    group: costs

  config_path:
    type: string
    default: configs
    description: "Folder of per-instrument configs, relative to the bot folder - one *.yaml per (symbol, direction), each inheriting these panel values and overriding what it names. Resolved by the LIVE AGENT's loader (agent.load_instrument_configs), so the backtest and the bot always trade the same set. Empty or _ falls back to the single instrument the `underlying` and `direction` parameters describe. With a folder, those two are ignored - every instrument declares its own."
    group: meta

  underlying:
    type: string
    default: SPY
    description: "Underlying symbol of the SINGLE-instrument fallback (config_path empty or _). Ignored when config_path names a folder. Its daily bars must exist as data/<underlying lowercase>_daily.json (see bars_file)."
    group: meta

  bars_file:
    type: string
    default: data/spy_daily.json
    description: "Daily bar store (Alpaca CLI download), relative to the bot folder. Used for TF Day only - TF Hour auto-fetches data/<underlying>_1h.json."
    group: meta
